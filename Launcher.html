<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft-In-Html · Cargando…</title>
<style>
:root{
	--grass:#5bab3c; --grass-d:#3f7d28; --dirt:#8a5a35; --dirt-d:#6b4326; --stone:#7d7d7d;
	--ui:#c6c6c6; --ui-d:#555; --accent:#7dff5a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:#fff;
	font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;image-rendering:pixelated}

/* ───────── Cielo ───────── */
#sky{position:fixed;inset:0;background:linear-gradient(#2b6fd1 0%,#5fa8ee 55%,#a9d6ff 100%);overflow:hidden}
#sun{position:absolute;top:9%;left:12%;width:72px;height:72px;background:#ffe86b;
	box-shadow:0 0 0 8px #fff3a8,0 0 0 16px rgba(255,243,168,.45),0 0 90px 30px rgba(255,235,120,.55);
	animation:sunMove 60s linear infinite alternate}
@keyframes sunMove{from{transform:translateX(0)}to{transform:translateX(60vw)}}
.cloud{position:absolute;height:34px;background:#fff;opacity:.92;
	box-shadow:34px -22px 0 0 #fff,68px 0 0 0 #fff,102px -12px 0 0 #fff;animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(-300px)}to{transform:translateX(calc(100vw + 300px))}}
.star{position:absolute;width:3px;height:3px;background:#fff;opacity:0}

/* ───────── Suelo ───────── */
#ground{position:fixed;left:0;right:0;bottom:0;height:26vh;min-height:150px;
	background:
		linear-gradient(var(--grass) 0 32px,var(--grass-d) 32px 40px,transparent 40px),
		repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 32px,transparent 32px 64px),
		repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 32px,transparent 32px 64px),
		var(--dirt);
	box-shadow:inset 0 -60px 80px rgba(0,0,0,.45)}
#ground::before{content:"";position:absolute;left:0;right:0;top:32px;height:14px;
	background:repeating-linear-gradient(90deg,var(--dirt-d) 0 16px,transparent 16px 40px,var(--dirt-d) 40px 48px,transparent 48px 80px)}

/* ───────── Partículas ───────── */
.p{position:absolute;bottom:20vh;width:8px;height:8px;background:var(--accent);opacity:0;
	box-shadow:0 0 8px var(--accent);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70vh) rotate(180deg);opacity:0}}

/* ───────── Escena central ───────── */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;z-index:5}

#logo{font-size:clamp(34px,8vw,84px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-align:center;line-height:1;
	color:#d9d9d9;text-shadow:0 1px 0 #bbb,0 2px 0 #999,0 3px 0 #777,0 4px 0 #555,0 5px 0 #444,0 6px 0 #333,0 14px 20px rgba(0,0,0,.55);
	position:relative;animation:logoIn 1s cubic-bezier(.2,1.4,.4,1) both;-webkit-text-stroke:2px #222}
#logo span{display:block;font-size:.34em;letter-spacing:.5em;color:var(--accent);-webkit-text-stroke:1px #123d05;
	text-shadow:0 3px 0 #1d5a0b,0 8px 12px rgba(0,0,0,.5);margin-top:10px}
#logo::after{content:"";position:absolute;inset:0;
	background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);
	background-size:250% 100%;mix-blend-mode:overlay;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes logoIn{from{transform:translateY(-80px) scale(.6);opacity:0}to{transform:none;opacity:1}}

/* Cubo 3D */
#cubeWrap{perspective:700px;height:130px;display:flex;align-items:flex-end;justify-content:center}
#cube{--s:84px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;
	animation:spin 7s linear infinite,bounce 1.4s ease-in-out infinite}
#cube i{position:absolute;inset:0;border:2px solid rgba(0,0,0,.55)}
#cube .t{background:
	conic-gradient(from 90deg at 50% 50%,#6dbd4a 0 25%,#4f9a33 0 50%,#68b646 0 75%,#589f3a 0) 0 0/21px 21px;
	transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
#cube .b{background:var(--dirt-d);transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
#cube .f,#cube .k,#cube .l,#cube .r{
	background:
		linear-gradient(var(--grass) 0 22%,var(--grass-d) 22% 28%,transparent 28%),
		conic-gradient(from 90deg at 50% 50%,#94623a 0 25%,#7a4c2a 0 50%,#8a5a35 0 75%,#6f4526 0) 0 0/21px 21px}
#cube .f{transform:translateZ(calc(var(--s)/2))}
#cube .k{transform:rotateY(180deg) translateZ(calc(var(--s)/2));filter:brightness(.7)}
#cube .l{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}
#cube .r{transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.9)}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
@keyframes bounce{0%,100%{margin-bottom:0}50%{margin-bottom:26px}}
#shadow{width:84px;height:14px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(4px);margin-top:-6px;animation:shadow 1.4s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.6);opacity:.25}}

/* Panel */
#panel{width:min(560px,92vw);background:rgba(20,20,20,.72);border:3px solid #000;
	box-shadow:inset 3px 3px 0 #8b8b8b,inset -3px -3px 0 #373737,0 18px 40px rgba(0,0,0,.5);
	padding:18px 18px 14px;backdrop-filter:blur(3px);animation:panelIn .8s .3s both ease-out}
@keyframes panelIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#status{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:10px;color:#eaeaea;text-shadow:2px 2px 0 #222}
#file{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pct{color:var(--accent);min-width:48px;text-align:right}

#bar{position:relative;height:28px;background:#1a1a1a;border:3px solid #000;
	box-shadow:inset 2px 2px 0 #3a3a3a,0 0 0 2px #8b8b8b;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;
	background:linear-gradient(#9dff7a,#5ed12f 45%,#3f9a1f 55%,#2f7a15);transition:none}
#fill::after{content:"";position:absolute;inset:0;
	background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
	background-size:200% 100%;animation:barShine 1.4s linear infinite}
@keyframes barShine{from{background-position:200% 0}to{background-position:-100% 0}}
#bar::after{content:"";position:absolute;inset:0;pointer-events:none;
	background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(0,0,0,.55) 18px 20px)}

#tip{margin-top:14px;min-height:36px;text-align:center;font-size:13px;color:#ffe38a;text-shadow:2px 2px 0 #3a2a00;transition:opacity .4s}
#tip.out{opacity:0}

/* Botones */
#actions{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.mcbtn{position:relative;display:inline-block;min-width:170px;padding:10px 16px;text-align:center;cursor:pointer;
	font:inherit;font-size:14px;color:#fff;text-shadow:2px 2px 0 #333;background:#6f6f6f;border:2px solid #000;
	box-shadow:inset 2px 2px 0 #a8a8a8,inset -2px -2px 0 #3b3b3b}
.mcbtn:hover{background:#5d7bd6;box-shadow:inset 2px 2px 0 #9fb3f0,inset -2px -2px 0 #2c3f87}
.mcbtn:active{transform:translateY(2px)}

/* Log */
#logBox{margin-top:10px;font-size:12px}
#logToggle{background:none;border:0;color:#aaa;cursor:pointer;font:inherit;padding:0}
#logToggle:hover{color:#fff}
#log{display:none;margin-top:8px;max-height:130px;overflow:auto;background:rgba(0,0,0,.55);border:2px solid #000;padding:8px;line-height:1.5;white-space:pre-wrap}
#log.open{display:block}
.info{color:#cfcfcf}.ok{color:#7ddc7d}.warn{color:#f0c36d}.err{color:#ff7b7b}

/* Error */
body.error #fill{background:linear-gradient(#ff8a8a,#d13a3a 45%,#9a1f1f 55%,#7a1515)}
body.error #cube,body.error .p{animation-play-state:paused}
body.error #pct{color:#ff7b7b}
body.error #actions{display:flex}

/* Salida */
#curtain{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .8s ease}
#curtain.on{opacity:1}
body.done #panel{transform:scale(.97);transition:transform .6s}
</style>
</head>
<body>

<div id="sky">
	<div id="sun"></div>
</div>
<div id="ground"></div>

<div id="stage">
	<h1 id="logo">Minecraft<span>in&nbsp;html</span></h1>

	<div id="cubeWrap">
		<div id="cube"><i class="t"></i><i class="b"></i><i class="f"></i><i class="k"></i><i class="l"></i><i class="r"></i></div>
	</div>
	<div id="shadow"></div>

	<section id="panel">
		<div id="status"><span id="file">Iniciando…</span><span id="pct">0%</span></div>
		<div id="bar"><div id="fill"></div></div>
		<div id="tip"></div>

		<div id="actions">
			<button class="mcbtn" id="btnRetry">Reintentar</button>
			<label class="mcbtn">Elegir carpeta local<input id="folder" type="file" webkitdirectory multiple hidden></label>
		</div>

		<div id="logBox">
			<button id="logToggle">▸ Mostrar registro</button>
			<div id="log"></div>
		</div>
	</section>
</div>

<div id="curtain"></div>

<!-- DATOS EMBEBIDOS: código del juego + mundos guardados. El launcher reescribe este bloque al guardar. -->
<script type="application/json" id="mc-data">{}</script>

<script>
(function () {
	"use strict"

	/* Copia del propio launcher (antes de tocar el DOM) para poder regenerarlo con los datos nuevos. */
	var SELF = "<!DOCTYPE html>\n" + document.documentElement.outerHTML
	var DATA_OPEN = "<scr" + 'ipt type="application/json" id="mc-data">'
	var DATA_CLOSE = "</scr" + "ipt>"

	var RAW_BASE = "https://raw.githubusercontent.com/Miqek/Minecraft-in--HTML/"
	var GITHUB_BASE = RAW_BASE + "main/"
	var GITHUB_API = "https://api.github.com/repos/Miqek/Minecraft-in--HTML/commits/main"
	var MIN_SHOW_MS = 2800

	var $ = function (id) { return document.getElementById(id) }

	/* ───────── Decoración (nubes, estrellas, partículas) ───────── */
	;(function decorate() {
		var sky = $("sky"), i, el
		for (i = 0; i < 7; i++) {
			el = document.createElement("div"); el.className = "cloud"
			el.style.top = (4 + Math.random() * 38) + "%"
			el.style.transform = "scale(" + (0.7 + Math.random() * 1.1).toFixed(2) + ")"
			el.style.animationDuration = (50 + Math.random() * 70) + "s"
			el.style.animationDelay = (-Math.random() * 100) + "s"
			sky.appendChild(el)
		}
		for (i = 0; i < 28; i++) {
			el = document.createElement("div"); el.className = "p"
			el.style.left = (Math.random() * 100) + "%"
			el.style.animationDuration = (3 + Math.random() * 5) + "s"
			el.style.animationDelay = (-Math.random() * 8) + "s"
			el.style.transform = "scale(" + (0.5 + Math.random()).toFixed(2) + ")"
			document.body.appendChild(el)
		}
	})()

	/* ───────── Consejos ───────── */
	var TIPS = [
		"Pulsa E para abrir el inventario.",
		"Los bloques de tierra con hierba se pueden colocar en cualquier sitio.",
		"Construye refugios antes de que caiga la noche.",
		"Tus mundos se guardan dentro de este mismo HTML (botón 💾 en el juego).",
		"Mantén pulsado el botón izquierdo para romper bloques.",
		"Excava hacia abajo con cuidado: la lava no perdona.",
		"El código se actualiza solo desde GitHub; tus mundos no se tocan.",
		"Un buen explorador siempre lleva antorchas."
	]
	var tipIdx = Math.floor(Math.random() * TIPS.length), tipEl = $("tip")
	function showTip() {
		tipEl.classList.add("out")
		setTimeout(function () {
			tipEl.textContent = "💡 " + TIPS[tipIdx++ % TIPS.length]
			tipEl.classList.remove("out")
		}, 400)
	}
	tipEl.textContent = "💡 " + TIPS[tipIdx++ % TIPS.length]
	setInterval(showTip, 4200)

	/* ───────── Progreso suave ───────── */
	var target = 0, shown = 0, fill = $("fill"), pctEl = $("pct")
	function setTarget(v) { target = Math.max(target, Math.min(100, v)) }
	;(function loop() {
		shown += (target - shown) * 0.08
		if (target - shown < 0.05) shown = target
		fill.style.width = shown + "%"
		pctEl.textContent = Math.floor(shown) + "%"
		requestAnimationFrame(loop)
	})()
	function setFile(t) { $("file").textContent = t }

	/* ───────── Registro ───────── */
	var logEl = $("log")
	function log(level, msg) {
		var d = document.createElement("div")
		d.className = level; d.textContent = msg
		logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight
	}
	$("logToggle").addEventListener("click", function () {
		var open = logEl.classList.toggle("open")
		this.textContent = (open ? "▾ Ocultar" : "▸ Mostrar") + " registro"
	})

	/* ═════════════════════════════════════════════════════════════
	 *  ALMACÉN PERSISTENTE (mundos + copia del código del juego)
	 *  Capas:  memoria  →  IndexedDB del launcher (caché inmediata)
	 *          →  este mismo HTML (bloque #mc-data), reescrito al guardar.
	 * ═════════════════════════════════════════════════════════════ */
	function clone(o) { return typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)) }

	function idbOpen() {
		return new Promise(function (res, rej) {
			var r = indexedDB.open("MCLauncher", 1)
			r.onupgradeneeded = function () { r.result.createObjectStore("kv") }
			r.onsuccess = function () { res(r.result) }
			r.onerror = function () { rej(r.error) }
		})
	}
	function kvGet(k) {
		return idbOpen().then(function (db) {
			return new Promise(function (res) {
				var q = db.transaction("kv").objectStore("kv").get(k)
				q.onsuccess = function () { res(q.result); db.close() }
				q.onerror = function () { res(undefined); db.close() }
			})
		}).catch(function () { return undefined })
	}
	function kvSet(k, v) {
		return idbOpen().then(function (db) {
			return new Promise(function (res) {
				var tx = db.transaction("kv", "readwrite")
				tx.objectStore("kv").put(v, k)
				tx.oncomplete = function () { res(true); db.close() }
				tx.onerror = tx.onabort = function () { res(false); db.close() }
			})
		}).catch(function () { return false })
	}

	var embedded = {}
	try { embedded = JSON.parse($("mc-data").textContent || "{}") || {} } catch (e) { embedded = {} }

	var state = { worlds: {}, updatedAt: 0 }   // worlds[id] = { id, data }  (misma forma que IndexedDB original)
	var bundle = null                          // { sha, builtAt, html }
	var fileHandle = null                      // FileSystemFileHandle del propio Launcher.html (Chromium)
	var dirty = false
	var autoTimer = null
	var uiBadge = null

	function newer(a, b, key) { return (a && b) ? (b[key] > a[key] ? b : a) : (a || b) }

	async function initStore() {
		var emState = embedded.state || null
		var idbState = await kvGet("state")
		var chosen = newer(emState, idbState, "updatedAt")
		if (chosen) state = clone(chosen)
		dirty = !!(idbState && idbState.updatedAt > (emState ? emState.updatedAt : 0))
		if (chosen === emState && emState && (!idbState || emState.updatedAt > idbState.updatedAt)) kvSet("state", state)

		var emBundle = embedded.html ? { sha: embedded.sha, builtAt: embedded.builtAt || 0, html: embedded.html } : null
		var idbBundle = await kvGet("bundle")
		bundle = newer(emBundle, idbBundle, "builtAt") || null
		fileHandle = (await kvGet("handle")) || null
	}

	function touch() {
		state.updatedAt = Date.now()
		dirty = true
		kvSet("state", state)
		refreshBadge()
		scheduleAutoWrite()
	}

	/* API compatible con las funciones IndexedDB del juego (js/world.js · sección #8) */
	window.MCStore = {
		get: function (id) {
			if (!id) return Promise.resolve(Object.keys(state.worlds).map(function (k) { return clone(state.worlds[k]) }))
			var r = state.worlds[id]
			return Promise.resolve(r ? clone(r) : undefined)
		},
		put: function (id, data) {
			state.worlds[id] = clone({ id: id, data: data })
			touch()
			return Promise.resolve(id)
		},
		remove: function (id) {
			delete state.worlds[id]
			touch()
			return Promise.resolve(undefined)
		},
		saveNow: function () { return saveNow() },
		mountUI: function () { mountUI() }
	}

	/* ───────── Reescritura del propio HTML ───────── */
	function buildSelf() {
		var a = SELF.indexOf(DATA_OPEN)
		var b = SELF.indexOf(DATA_CLOSE, a)
		if (a < 0 || b < 0) throw new Error("No se encuentra el bloque #mc-data en el launcher.")
		var payload = JSON.stringify({
			v: 1,
			sha: bundle ? bundle.sha : null,
			builtAt: bundle ? bundle.builtAt : 0,
			html: bundle ? bundle.html : "",
			state: state
		}).replace(/</g, "\\u003c")
		return SELF.slice(0, a + DATA_OPEN.length) + payload + SELF.slice(b)
	}

	async function writeFile(interactive) {
		if (!fileHandle) return false
		var perm = await fileHandle.queryPermission({ mode: "readwrite" })
		if (perm !== "granted") {
			if (!interactive) return false
			perm = await fileHandle.requestPermission({ mode: "readwrite" })
			if (perm !== "granted") return false
		}
		var w = await fileHandle.createWritable()
		await w.write(new Blob([buildSelf()], { type: "text/html" }))
		await w.close()
		dirty = false
		refreshBadge()
		return true
	}

	function scheduleAutoWrite() {
		if (!fileHandle) return
		clearTimeout(autoTimer)
		autoTimer = setTimeout(function () {
			writeFile(false).then(function (ok) { if (ok) toast("✔ Guardado dentro del HTML") }).catch(function (e) { console.error(e) })
		}, 2000)
	}

	function downloadSelf() {
		var url = URL.createObjectURL(new Blob([buildSelf()], { type: "text/html" }))
		var a = document.createElement("a")
		a.href = url; a.download = "Launcher.html"
		document.body.appendChild(a); a.click(); a.remove()
		setTimeout(function () { URL.revokeObjectURL(url) }, 10000)
		dirty = false
		refreshBadge()
	}

	async function saveNow() {
		try {
			if (!fileHandle && window.showSaveFilePicker) {
				fileHandle = await window.showSaveFilePicker({
					suggestedName: "Launcher.html",
					types: [{ description: "Launcher HTML", accept: { "text/html": [".html"] } }]
				})
				kvSet("handle", fileHandle)
			}
			if (fileHandle && await writeFile(true)) { toast("✔ Guardado dentro del HTML"); return true }
		} catch (e) {
			if (e && e.name === "AbortError") return false
			console.error(e)
		}
		downloadSelf()
		toast("⬇ Descargado: sustituye tu Launcher.html por el nuevo")
		return true
	}

	/* ───────── Interfaz dentro del juego ───────── */
	function toast(msg) {
		var t = document.getElementById("mc-toast")
		if (!t) {
			t = document.createElement("div"); t.id = "mc-toast"
			t.style.cssText = "position:fixed;left:12px;bottom:56px;z-index:100000;background:rgba(0,0,0,.8);color:#fff;font:13px 'Courier New',monospace;padding:8px 12px;border:2px solid #000;opacity:0;transition:opacity .3s;pointer-events:none"
			;(document.body || document.documentElement).appendChild(t)
		}
		t.textContent = msg; t.style.opacity = "1"
		clearTimeout(t._h); t._h = setTimeout(function () { t.style.opacity = "0" }, 3500)
	}
	function refreshBadge() {
		if (!uiBadge) return
		uiBadge.textContent = (dirty ? "● " : "✔ ") + "Guardar en HTML"
		uiBadge.style.background = dirty ? "#a86a1a" : "#3b7d28"
	}
	function mountUI() {
		if (!document.body || document.getElementById("mc-savebtn")) return
		var b = document.createElement("button")
		b.id = "mc-savebtn"
		b.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:100000;color:#fff;font:bold 13px 'Courier New',monospace;padding:9px 14px;border:2px solid #000;cursor:pointer;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.35)"
		b.title = "Escribe el código del juego y todos tus mundos dentro de Launcher.html"
		b.addEventListener("click", function (e) { e.stopPropagation(); saveNow() })
		b.addEventListener("mousedown", function (e) { e.stopPropagation() })
		document.body.appendChild(b)
		uiBadge = b
		refreshBadge()
		window.addEventListener("beforeunload", function (e) {
			if (dirty && !fileHandle) { e.preventDefault(); e.returnValue = "Hay cambios sin guardar en el HTML." }
		})
		scheduleAutoWrite()
	}

	/* ───────── Rutas ───────── */
	function normalize(path) {
		var out = []
		String(path).replace(/\\/g, "/").split("/").forEach(function (seg) {
			if (seg === "" || seg === ".") return
			if (seg === "..") { out.pop(); return }
			out.push(seg)
		})
		return out.join("/")
	}
	function dirname(p) { var i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0, i) }
	function basename(p) { var i = p.lastIndexOf("/"); return i < 0 ? p : p.slice(i + 1) }
	function stripQuery(r) { return r.replace(/[?#].*$/, "") }
	function isHttp(r) { return /^(?:https?:)?\/\//i.test(r) }
	function isRemote(r) { return isHttp(r) || /^(?:data|blob|about|javascript|mailto):/i.test(r) || r.charAt(0) === "#" }
	function resolve(baseDir, ref) {
		ref = stripQuery(ref.trim())
		return ref.charAt(0) === "/" ? normalize(ref) : normalize(baseDir + "/" + ref)
	}
	var MIME = { png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif", webp:"image/webp", svg:"image/svg+xml",
		ico:"image/x-icon", woff:"font/woff", woff2:"font/woff2", ttf:"font/ttf", otf:"font/otf", css:"text/css", js:"text/javascript" }
	function mimeOf(p, blob) {
		if (blob && blob.type) return blob.type
		return MIME[(p.split(".").pop() || "").toLowerCase()] || "application/octet-stream"
	}

	function getAttr(tag, name) {
		var m = new RegExp("(?:^|[\\s\"'])" + name + "\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)'|([^\\s>]+))", "i").exec(tag)
		if (!m) return null
		return m[1] !== undefined ? m[1] : (m[2] !== undefined ? m[2] : m[3])
	}
	function removeAttrs(attrs, names) {
		names.forEach(function (n) {
			attrs = attrs.replace(new RegExp("\\s+" + n + "(?:\\s*=\\s*(?:\"[^\"]*\"|'[^']*'|[^\\s>]+))?", "gi"), "")
		})
		return attrs
	}
	async function replaceAsync(str, re, fn) {
		var matches = [], m
		re.lastIndex = 0
		while ((m = re.exec(str)) !== null) { matches.push(m); if (m[0].length === 0) re.lastIndex++ }
		var out = "", pos = 0
		for (var i = 0; i < matches.length; i++) {
			out += str.slice(pos, matches[i].index) + await fn.apply(null, matches[i])
			pos = matches[i].index + matches[i][0].length
		}
		return out + str.slice(pos)
	}
	async function toDataURL(blob, mime) {
		var bytes = new Uint8Array(await blob.arrayBuffer()), bin = "", CH = 0x8000
		for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH))
		return "data:" + mime + ";base64," + btoa(bin)
	}

	/* ───────── Fuentes ───────── */
	function HttpSource(base) { this.base = base; this.label = base }
	HttpSource.prototype._get = async function (p) {
		var r = await fetch(new URL(p, this.base).href, { cache: "no-store" })
		if (!r.ok) throw new Error("HTTP " + r.status + " al leer «" + p + "»")
		return r
	}
	HttpSource.prototype.text = async function (p) { return (await this._get(p)).text() }
	HttpSource.prototype.blob = async function (p) { return (await this._get(p)).blob() }

	function FolderSource(fileList) {
		var list = Array.prototype.slice.call(fileList), roots = {}, self = this
		list.forEach(function (f) { roots[(f.webkitRelativePath || f.name).split("/")[0]] = true })
		var strip = Object.keys(roots).length === 1 && list.some(function (f) { return (f.webkitRelativePath || "").indexOf("/") > 0 })
		this.map = {}; this.lower = {}
		list.forEach(function (f) {
			var rel = normalize(f.webkitRelativePath || f.name)
			if (strip) rel = rel.split("/").slice(1).join("/")
			self.map[rel] = f; self.lower[rel.toLowerCase()] = f
		})
		this.label = "carpeta local (" + list.length + " archivos)"
	}
	FolderSource.prototype._file = function (p) {
		var f = this.map[p] || this.lower[p.toLowerCase()]
		if (!f) throw new Error("No está en la carpeta: «" + p + "»")
		return f
	}
	FolderSource.prototype.text = async function (p) { return this._file(p).text() }
	FolderSource.prototype.blob = async function (p) { return this._file(p) }

	/* ───────── Construcción ───────── */
	async function inlineCss(source, path, ctx, stack) {
		stack = stack || []
		if (stack.indexOf(path) >= 0) throw new Error("@import circular en «" + path + "»")
		var dir = dirname(path)
		var css = await source.text(path)

		css = await replaceAsync(css, /@import\s+(?:url\(\s*)?(["']?)([^"')\s;]+)\1\s*\)?([^;]*);/gi, async function (all, q, ref, media) {
			if (isRemote(ref)) { if (isHttp(ref)) ctx.remote.push(ref); return all }
			var p = resolve(dir, ref)
			if (ctx.isExcluded(p)) return all
			ctx.inlined.push(p)
			var inner = await inlineCss(source, p, ctx, stack.concat(path))
			media = media.trim()
			return media ? "@media " + media + " {\n" + inner + "\n}" : inner
		})
		css = await replaceAsync(css, /url\(\s*(["']?)([^"')]+)\1\s*\)/gi, async function (all, q, ref) {
			ref = ref.trim()
			if (isRemote(ref)) { if (isHttp(ref)) ctx.remote.push(ref); return all }
			var p = resolve(dir, ref)
			try {
				var b = await source.blob(p)
				ctx.inlined.push(p)
				return 'url("' + await toDataURL(b, mimeOf(p, b)) + '")'
			} catch (e) { ctx.warn("No se pudo incrustar «" + p + "»: " + e.message); return all }
		})
		return css
	}

	async function build(source) {
		var ctx = { inlined: [], remote: [], excluded: [], warnings: [] }
		ctx.warn = function (m) { ctx.warnings.push(m); log("warn", m) }

		setFile("Leyendo js/bootstrap/module-manifest.js…"); setTarget(4)
		var manifestSource = await source.text("js/bootstrap/module-manifest.js")
		var manifestMatch = /window\.MineKhanManifest\s*=\s*\[([\s\S]*)\]\s*;?\s*$/.exec(manifestSource)
		if (!manifestMatch) throw new Error("js/bootstrap/module-manifest.js: no se encuentra «MineKhanManifest».")

		var modules = [], modulePattern = /\{\s*id:\s*"([^"]+)"\s*,\s*file:\s*"([^"]+)"\s*,\s*requires:\s*\[([^\]]*)\]\s*\}/g
		var moduleMatch
		while ((moduleMatch = modulePattern.exec(manifestMatch[1])) !== null) {
			var requires = [], requirePattern = /["']([^"']+)["']/g, requireMatch
			while ((requireMatch = requirePattern.exec(moduleMatch[3])) !== null) requires.push(requireMatch[1])
			modules.push({ id: moduleMatch[1], file: moduleMatch[2], requires: requires })
		}
		var declaredModules = manifestMatch[1].match(/\bid\s*:/g) || []
		if (!modules.length || modules.length !== declaredModules.length) {
			throw new Error("js/bootstrap/module-manifest.js: el manifiesto de módulos no es válido.")
		}

		var moduleMap = {}
		modules.forEach(function (mod) {
			if (!mod || typeof mod.id !== "string" || typeof mod.file !== "string") {
				throw new Error("js/bootstrap/module-manifest.js: cada módulo necesita «id» y «file».")
			}
			if (moduleMap[mod.id]) throw new Error("js/bootstrap/module-manifest.js: ID de módulo duplicado: " + mod.id)
			moduleMap[mod.id] = mod
		})

		var orderedModules = [], visited = {}, visiting = {}
		function visitModule(id) {
			if (visited[id]) return
			if (visiting[id]) throw new Error("Dependencia circular en el módulo: " + id)
			var mod = moduleMap[id]
			if (!mod) throw new Error("Módulo requerido no encontrado en module-manifest.js: " + id)
			visiting[id] = true
			if (Array.isArray(mod.requires)) mod.requires.forEach(visitModule)
			visiting[id] = false
			visited[id] = true
			orderedModules.push(mod)
		}
		modules.forEach(function (mod) { visitModule(mod.id) })

		ctx.isExcluded = function () { return false }
		log("ok", "module-manifest.js OK · " + orderedModules.length + " módulos")

		var entry = "js/bootstrap/index.html"
		setFile("Descargando " + entry + "…"); setTarget(10)
		var html = await source.text(entry)
		var baseTag = /<base\b[^>]*>/i.exec(html)
		var baseHref = baseTag && getAttr(baseTag[0], "href")
		var base = baseHref ? resolve(dirname(entry), baseHref) : dirname(entry)
		log("ok", "Entrypoint cargado: " + entry)

		var total = 0
		;(html.match(/<link\b[^>]*>/gi) || []).forEach(function (t) {
			var h = getAttr(t, "href"); if (h && !isRemote(h) && !ctx.isExcluded(resolve(base, h))) total++
		})
		;(html.match(/<script\b[^>]*>/gi) || []).forEach(function (t) {
			var s = getAttr(t, "src"); if (s && !isRemote(s) && !ctx.isExcluded(resolve(base, s))) total++
		})
		total += orderedModules.length + 1
		total = Math.max(total, 1)
		var done = 0
		function tick(name) { done++; setTarget(10 + (done / total) * 80); setFile("Integrando " + name) }

		var bundledScripts = []
		for (var moduleIndex = 0; moduleIndex < orderedModules.length; moduleIndex++) {
			var modulePath = normalize(orderedModules[moduleIndex].file)
			bundledScripts.push(await source.text(modulePath))
			ctx.inlined.push(modulePath)
			log("ok", "Módulo integrado: " + modulePath)
			tick(modulePath)
		}
		var assemblerPath = "js/bootstrap/assembler.js"
		bundledScripts.push(await source.text(assemblerPath))
		ctx.inlined.push(assemblerPath)
		log("ok", "Ensamblador integrado: " + assemblerPath)
		tick(assemblerPath)
		html = await replaceAsync(html, /<link\b[^>]*>/gi, async function (tag) {
			var rel = (getAttr(tag, "rel") || "").toLowerCase(), href = getAttr(tag, "href")
			if (!href) return tag
			if (isRemote(href)) { if (isHttp(href)) ctx.remote.push(href); return tag }
			var p = resolve(base, href)
			if (ctx.isExcluded(p)) return tag
			setFile("Descargando " + p + "…")
			if (/\bstylesheet\b/.test(rel)) {
				var css
				try {
					css = await inlineCss(source, p, ctx)
				} catch (e) {
					ctx.warn("No se pudo integrar la hoja de estilos «" + p + "»: " + e.message)
					return ""
				}
				ctx.inlined.push(p)
				var media = getAttr(tag, "media")
				log("ok", "CSS integrado: " + p); tick(p)
				return "<style" + (media ? ' media="' + media + '"' : "") + ">\n" + css.replace(/<\/style/gi, "<\\/style") + "\n</style>"
			}
			if (/\bicon\b/.test(rel)) {
				var b = await source.blob(p), data = await toDataURL(b, mimeOf(p, b))
				ctx.inlined.push(p)
				log("ok", "Icono integrado: " + p); tick(p)
				return tag.replace(href, function () { return data })
			}
			return tag
		})

		html = await replaceAsync(html, /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, async function (all, attrs) {
			var src = getAttr(attrs, "src")
			if (!src) return all
			if (isRemote(src)) { if (isHttp(src)) ctx.remote.push(src); return all }
			var p = resolve(base, src)
			if (ctx.isExcluded(p)) return all
			if (p === "js/bootstrap/loader.js") {
				ctx.inlined.push(p)
				log("ok", "Bootstrap modular integrado · " + orderedModules.length + " módulos")
				tick("bootstrap modular")
				var keepLoaderAttrs = removeAttrs(attrs, ["src", "async", "defer", "integrity", "crossorigin"])
				return bundledScripts.map(function (code) {
					return "<script" + keepLoaderAttrs + ">\n" +
						code.replace(/<\/script/gi, "<\\/script").replace(/<!\x2d\x2d/g, "<\\!--") +
						"\n<\/script>"
				}).join("\n")
			}
			setFile("Descargando " + p + "…")
			var code = await source.text(p)
			var type = (getAttr(attrs, "type") || "").toLowerCase()
			if (type === "module" && /(^|\n)\s*import[\s{*"']|\bimport\s*\(/.test(code)) {
				ctx.warn("«" + p + "» es módulo ES con import: se deja como enlace.")
				return all
			}
			ctx.inlined.push(p)
			log("ok", "JS integrado: " + p + " (" + code.length.toLocaleString() + " car.)"); tick(p)
			var keep = removeAttrs(attrs, ["src", "async", "defer", "integrity", "crossorigin"])
			return "<script" + keep + ">\n" + code.replace(/<\/script/gi, "<\\/script").replace(/<!\x2d\x2d/g, "<\\!--") + "\n<\/script>"
		})

		var uniq = function (a) { return a.filter(function (x, i) { return a.indexOf(x) === i }) }
		return { html: html, inlined: uniq(ctx.inlined), remote: uniq(ctx.remote) }
	}

	/* ───────── Actualización del código desde GitHub ───────── */
	async function latestSha() {
		try {
			var c = new AbortController()
			var t = setTimeout(function () { c.abort() }, 6000)
			var r = await fetch(GITHUB_API, { headers: { Accept: "application/vnd.github.sha" }, cache: "no-store", signal: c.signal })
			clearTimeout(t)
			if (!r.ok) return null
			var s = (await r.text()).trim()
			return /^[0-9a-f]{40}$/i.test(s) ? s : null
		} catch (e) { return null }
	}

	function remember(html, sha) {
		bundle = { sha: sha, builtAt: Date.now(), html: html }
		kvSet("bundle", bundle)
		dirty = true
	}

	async function obtain(source) {
		var remoteMode = source === "github"
		var sha = null

		if (remoteMode) {
			setFile("Buscando actualizaciones…"); setTarget(3)
			sha = await latestSha()
			if (sha && bundle && bundle.sha === sha) {
				log("ok", "Código al día (" + sha.slice(0, 7) + "): se usa la copia guardada en el HTML")
				setTarget(90)
				return { html: bundle.html, inlined: [], remote: [], cached: true }
			}
			log("info", sha ? "Nueva versión en GitHub: " + sha.slice(0, 7) : "No se pudo consultar la última versión; se descarga la rama main")
			source = new HttpSource(sha ? RAW_BASE + sha + "/" : GITHUB_BASE)
		}

		log("info", "Origen: " + source.label)
		try {
			var result = await build(source)
			remember(result.html, remoteMode ? (sha || "main-" + Date.now()) : "local-" + Date.now())
			return result
		} catch (e) {
			if (bundle && remoteMode) {
				log("warn", "No se pudo actualizar (" + e.message + "). Se usa la copia guardada en el HTML.")
				setTarget(90)
				return { html: bundle.html, inlined: [], remote: [], cached: true }
			}
			throw e
		}
	}

	/* ───────── Ejecución ───────── */
	var running = false, lastSource = "github"

	function launch(html) {
		document.body.classList.add("done")
		setFile("¡Mundo generado!"); setTarget(100)
		$("curtain").classList.add("on")
		var mount = "<scr" + "ipt>try{window.MCStore.mountUI()}catch(e){console.error(e)}</scr" + "ipt>"
		var i = html.toLowerCase().lastIndexOf("</body>")
		var out = i >= 0 ? html.slice(0, i) + mount + html.slice(i) : html + mount
		setTimeout(function () { document.open(); document.write(out); document.close() }, 900)
	}

	async function run(source) {
		if (running) return
		running = true; lastSource = source
		document.body.classList.remove("error")
		logEl.textContent = ""; target = 0; shown = 0
		var t0 = Date.now()
		try {
			setFile("Conectando…")
			var result = await obtain(source)
			result.remote.forEach(function (u) { log("warn", "Recurso remoto (necesita internet): " + u) })
			var nWorlds = Object.keys(state.worlds).filter(function (k) { return k !== "settings" }).length
			log("ok", "✔ " + (result.cached ? "copia guardada" : result.inlined.length + " archivos integrados") + " · " + (result.html.length / 1024).toFixed(1) + " KB · " + nWorlds + " mundo(s) guardado(s)")
			setFile("Generando terreno…"); setTarget(96)
			var wait = Math.max(0, MIN_SHOW_MS - (Date.now() - t0))
			await new Promise(function (r) { setTimeout(r, wait) })
			launch(result.html)
		} catch (e) {
			running = false
			document.body.classList.add("error")
			setFile("Error: " + e.message)
			log("err", "✖ " + e.message)
			$("logToggle").click && !logEl.classList.contains("open") && $("logToggle").click()
		}
	}

	$("btnRetry").addEventListener("click", function () { run(lastSource || "github") })
	$("folder").addEventListener("change", function (e) {
		if (e.target.files && e.target.files.length) run(new FolderSource(e.target.files))
	})

	var isWeb = location.protocol === "http:" || location.protocol === "https:"
	var onGitHubPages = isWeb && /github\.io$/i.test(location.hostname)
	var firstSource = isWeb && !onGitHubPages ? new HttpSource(new URL(".", location.href).href) : "github"

	initStore().catch(function (e) { console.error(e) }).then(function () { run(firstSource) })
})()
</script>
