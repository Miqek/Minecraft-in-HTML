<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft-In-Html · Launcher</title>
<style>
	:root { color-scheme: dark; }
	body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #1b1b1b; color: #e8e8e8; }
	main { max-width: 860px; margin: 0 auto; padding: 24px 16px 56px; }
	h1 { margin: 0 0 4px; font-size: 24px; }
	h2 { margin: 0 0 8px; font-size: 16px; }
	.sub, .hint { color: #a8a8a8; font-size: 14px; }
	.card { background: #262626; border: 1px solid #3a3a3a; border-radius: 8px; padding: 16px; margin: 16px 0; }
	button, label.btn { display: inline-block; background: #3b7d3b; color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; font: inherit; cursor: pointer; margin: 0 8px 8px 0; }
	button.secondary, label.btn { background: #444; }
	button:disabled { opacity: .45; cursor: not-allowed; }
	#log { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; max-height: 340px; overflow: auto; }
	.info { color: #cfcfcf; } .ok { color: #7ddc7d; } .warn { color: #f0c36d; } .err { color: #ff7b7b; }
	code { background: #333; padding: 1px 5px; border-radius: 4px; }
	ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; color: #c8c8c8; } li { margin: 4px 0; }
</style>
</head>
<body>
<main>
	<h1>Minecraft-In-Html · Launcher</h1>
	<p class="sub">Descargando y empaquetando recursos desde GitHub para iniciar el juego...</p>

	<section class="card">
		<h2>Estado y Origen</h2>
		<button id="btnGithub">Reintentar desde GitHub</button>
		<label class="btn">Cargar carpeta local…<input id="folder" type="file" webkitdirectory multiple hidden></label>
		<p id="mode" class="hint"></p>
	</section>

	<section class="card">
		<h2>Acciones manuales</h2>
		<button id="btnOpen" disabled>▶ Abrir el juego</button>
		<button id="btnSave" class="secondary" disabled>⬇ Descargar HTML autocontenido</button>
		<p id="stats" class="hint"></p>
	</section>

	<section class="card"><h2>Registro</h2><div id="log"></div></section>
</main>

<script>
(function () {
	"use strict"

	var GITHUB_BASE = "https://raw.githubusercontent.com/Miqek/Minecraft-in-HTML/main/";

	function normalize(path) {
		var out = []
		String(path).replace(/\\/g, "/").split("/").forEach(function (seg) {
			if (seg === "" || seg === ".") return
			if (seg === "..") { out.pop(); return }
			out.push(seg)
		})
		return out.join("/")
	}
	function dirname(p) { var i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0, i) }
	function basename(p) { var i = p.lastIndexOf("/"); return i < 0 ? p : p.slice(i + 1) }
	function stripQuery(ref) { return ref.replace(/[?#].*$/, "") }
	function isHttp(ref) { return /^(?:https?:)?\/\//i.test(ref) }
	function isRemote(ref) { return isHttp(ref) || /^(?:data|blob|about|javascript|mailto):/i.test(ref) || ref.charAt(0) === "#" }
	function resolve(baseDir, ref) {
		ref = stripQuery(ref.trim())
		return ref.charAt(0) === "/" ? normalize(ref) : normalize(baseDir + "/" + ref)
	}

	var MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml",
		ico: "image/x-icon", woff: "font/woff", woff2: "font/woff2", ttf: "font/ttf", otf: "font/otf", css: "text/css", js: "text/javascript" }
	function mimeOf(path, blob) {
		if (blob && blob.type) return blob.type
		return MIME[(path.split(".").pop() || "").toLowerCase()] || "application/octet-stream"
	}

	function getAttr(tag, name) {
		var m = new RegExp("(?:^[\\s\"'])" + name + "\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)'|([^\\s>]+))", "i").exec(tag)
		if (!m) return null
		return m[1] !== undefined ? m[1] : (m[2] !== undefined ? m[2] : m[3])
	}
	function removeAttrs(attrs, names) {
		names.forEach(function (n) {
			attrs = attrs.replace(new RegExp("\\s+" + n + "(?:\\s*=\\s*(?:\"[^\"]*\"|'[^']*'|[^\\s>]+))?", "gi"), "")
		})
		return attrs
	}

	async function replaceAsync(str, re, fn) {
		var matches = [], m
		re.lastIndex = 0
		while ((m = re.exec(str)) !== null) { matches.push(m); if (m[0].length === 0) re.lastIndex++ }
		var out = "", pos = 0
		for (var i = 0; i < matches.length; i++) {
			out += str.slice(pos, matches[i].index) + await fn.apply(null, matches[i])
			pos = matches[i].index + matches[i][0].length
		}
		return out + str.slice(pos)
	}

	async function toDataURL(blob, mime) {
		var bytes = new Uint8Array(await blob.arrayBuffer()), bin = "", CH = 0x8000
		for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH))
		return "data:" + mime + ";base64," + btoa(bin)
	}

	function HttpSource(baseUrl) { this.base = baseUrl; this.label = baseUrl }
	HttpSource.prototype._get = async function (path) {
		var r = await fetch(new URL(path, this.base).href, { cache: "no-store" })
		if (!r.ok) throw new Error("HTTP " + r.status + " al leer «" + path + "»")
		return r
	}
	HttpSource.prototype.text = async function (p) { return (await this._get(p)).text() }
	HttpSource.prototype.blob = async function (p) { return (await this._get(p)).blob() }

	function FolderSource(fileList) {
		var list = Array.prototype.slice.call(fileList)
		var roots = {}
		list.forEach(function (f) { roots[(f.webkitRelativePath || f.name).split("/")[0]] = true })
		var strip = Object.keys(roots).length === 1 && list.some(function (f) { return (f.webkitRelativePath || "").indexOf("/") > 0 })
		this.map = {}; this.lower = {}
		var self = this
		list.forEach(function (f) {
			var rel = normalize(f.webkitRelativePath || f.name)
			if (strip) rel = rel.split("/").slice(1).join("/")
			self.map[rel] = f; self.lower[rel.toLowerCase()] = f
		})
		this.label = "carpeta seleccionada (" + list.length + " archivos)"
	}
	FolderSource.prototype._file = function (p) {
		var f = this.map[p] || this.lower[p.toLowerCase()]
		if (!f) throw new Error("No está en la carpeta: «" + p + "»")
		return f
	}
	FolderSource.prototype.text = async function (p) { return this._file(p).text() }
	FolderSource.prototype.blob = async function (p) { return this._file(p) }

	async function inlineCss(source, path, ctx, stack) {
		stack = stack || []
		if (stack.indexOf(path) >= 0) throw new Error("@import circular en «" + path + "»")
		var dir = dirname(path)
		var css = await source.text(path)

		css = await replaceAsync(css, /@import\s+(?:url\(\s*)?(["']?)([^"')\s;]+)\1\s*\)?([^;]*);/gi, async function (all, q, ref, media) {
			if (isRemote(ref)) { if (isHttp(ref)) ctx.remote.push(ref); return all }
			var p = resolve(dir, ref)
			if (ctx.isExcluded(p)) { ctx.excluded.push(p); return all }
			ctx.inlined.push(p)
			var inner = await inlineCss(source, p, ctx, stack.concat(path))
			media = media.trim()
			return media ? "@media " + media + " {\n" + inner + "\n}" : inner
		})

		css = await replaceAsync(css, /url\(\s*(["']?)([^"')]+)\1\s*\)/gi, async function (all, q, ref) {
			ref = ref.trim()
			if (isRemote(ref)) { if (isHttp(ref)) ctx.remote.push(ref); return all }
			var p = resolve(dir, ref)
			try {
				var b = await source.blob(p)
				ctx.inlined.push(p)
				return 'url("' + await toDataURL(b, mimeOf(p, b)) + '")'
			} catch (e) {
				ctx.warn("No se pudo incrustar «" + p + "»: " + e.message)
				return all
			}
		})
		return css
	}

	async function build(source, onLog) {
		var ctx = { inlined: [], remote: [], excluded: [], warnings: [] }
		ctx.log = onLog || function () {}
		ctx.warn = function (m) { ctx.warnings.push(m); ctx.log("warn", m) }

		var manifest = JSON.parse(await source.text("manifest.json"))
		if (!manifest || typeof manifest.entrypoint !== "string") throw new Error("manifest.json: falta «entrypoint».")
		var excl = (Array.isArray(manifest.exclude) ? manifest.exclude : []).map(function (e) { return normalize(e).toLowerCase() })
		ctx.isExcluded = function (p) { var l = p.toLowerCase(); return excl.indexOf(l) >= 0 || excl.indexOf(basename(l)) >= 0 }
		ctx.log("info", "Leyendo manifest.json...")

		var entry = normalize(manifest.entrypoint)
		var html = await source.text(entry)
		var base = dirname(entry)
		ctx.log("info", "Cargando código base: " + entry)

		html = await replaceAsync(html, /<link\b[^>]*>/gi, async function (tag) {
			var rel = (getAttr(tag, "rel") || "").toLowerCase(), href = getAttr(tag, "href")
			if (!href) return tag
			if (isRemote(href)) { if (isHttp(href)) ctx.remote.push(href); return tag }
			var p = resolve(base, href)
			if (ctx.isExcluded(p)) return tag
			if (/\bstylesheet\b/.test(rel)) {
				var css = await inlineCss(source, p, ctx)
				ctx.inlined.push(p)
				var media = getAttr(tag, "media")
				ctx.log("ok", "CSS integrado: " + p)
				return "<style" + (media ? ' media="' + media + '"' : "") + ">\n" + css.replace(/<\/style/gi, "<\\/style") + "\n</style>"
			}
			if (/\bicon\b/.test(rel)) {
				var b = await source.blob(p)
				ctx.inlined.push(p)
				return tag.replace(href, function () { return toDataURL(b, mimeOf(p, b)) })
			}
			return tag
		})

		html = await replaceAsync(html, /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi, async function (all, attrs) {
			var src = getAttr(attrs, "src")
			if (!src) return all
			if (isRemote(src)) { if (isHttp(src)) ctx.remote.push(src); return all }
			var p = resolve(base, src)
			if (ctx.isExcluded(p)) return all
			var code = await source.text(p)
			ctx.inlined.push(p)
			ctx.log("ok", "JS integrado: " + p)
			var keep = removeAttrs(attrs, ["src", "async", "defer", "integrity", "crossorigin"])
			return "<script" + keep + ">\n" + code.replace(/<\/script/gi, "<\\/script>").replace(/<!--/g, "<\\!--") + "\n<\/script>"
		})

		var uniq = function (a) { return a.filter(function (x, i) { return a.indexOf(x) === i }) }
		return { html: html, entry: entry, manifest: manifest, inlined: uniq(ctx.inlined), remote: uniq(ctx.remote) }
	}

	var $ = function (id) { return document.getElementById(id) }
	var current = null

	function log(level, msg) {
		var d = document.createElement("div")
		d.className = level
		d.textContent = msg
		$("log").appendChild(d)
		$("log").scrollTop = $("log").scrollHeight
	}
	function setReady(ok) { $("btnOpen").disabled = !ok; $("btnSave").disabled = !ok }
	function blobUrl() { return URL.createObjectURL(new Blob([current.html], { type: "text/html;charset=utf-8" })) }

	function launchDirectly(html) {
		log("ok", "Iniciando juego...")
		setTimeout(function () {
			document.open()
			document.write(html)
			document.close()
		}, 600)
	}

	async function run(source, autoLaunch) {
		$("log").textContent = ""
		setReady(false)
		current = null
		try {
			log("info", "Conectando con: " + source.label)
			current = await build(source, log)
			var kb = (current.html.length / 1024).toFixed(1)
			log("ok", "✔ Todo listo: " + kb + " KB (" + current.inlined.length + " archivos integrados)")
			$("stats").textContent = current.inlined.length + " archivos · " + kb + " KB"
			setReady(true)

			if (autoLaunch) {
				launchDirectly(current.html)
			}
		} catch (e) {
			log("err", "✖ Error: " + e.message)
		}
	}

	$("btnGithub").addEventListener("click", function () { run(new HttpSource(GITHUB_BASE), true) })
	$("folder").addEventListener("change", function (e) { if (e.target.files && e.target.files.length) run(new FolderSource(e.target.files), false) })
	$("btnOpen").addEventListener("click", function () { if (current) launchDirectly(current.html) })
	$("btnSave").addEventListener("click", function () {
		if (!current) return
		var a = document.createElement("a")
		a.href = blobUrl()
		a.download = "Minecraft-Standalone.html"
		document.body.appendChild(a)
		a.click()
		a.remove()
	})

	if (location.protocol === "http:" || location.protocol === "https:") {
		var isGitHubHost = location.hostname.indexOf("github") !== -1
		var src = isGitHubHost ? GITHUB_BASE : new URL(".", location.href).href
		$("mode").textContent = "Cargando automáticamente desde el servidor web..."
		run(new HttpSource(src), true)
	} else {
		$("mode").textContent = "Archivo local (file://): descargando recursos de GitHub automáticamente..."
		run(new HttpSource(GITHUB_BASE), true)
	}
})()
</script>
</body>
</html>
